name: Build and verify

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://expense_app:expense_test_password@localhost:5432/smart_expense_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smart_expense_test
          POSTGRES_USER: expense_app
          POSTGRES_PASSWORD: expense_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_app -d smart_expense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app/app.py app/tests/test_app.py
      - name: Run application flow checks
        run: cd app && python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/static/app.js
